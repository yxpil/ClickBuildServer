<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问卷系统 · ClickBuild</title>
<style>
:root{
  --paper:#F4F2EB;
  --ink:#141412;
  --muted:#666157;
  --line:#D8D3C6;
  --card:#FBF9F3;
  --accent:#2C5A4A;
  --accent-2:#DDE9E2;
  --warn:#A24D2A;
  --mono:"SFMono-Regular","Cascadia Code","Consolas",monospace;
  --serif:"Songti SC","Noto Serif SC","Georgia",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:#111110;color:#F7F4EA;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid #2A2A27}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #6E6A60;border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#D8D4C8}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand span.sub{font-family:var(--mono);font-size:10px;color:#8E8B82;letter-spacing:.16em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:6px}
.nav button{background:none;border:1px solid transparent;color:#C9C5B9;padding:7px 12px;border-radius:2px;font-size:13px}
.nav button:hover{color:#fff;border-color:#3A3A36}
.nav button.on{color:#fff;background:#2A2A27;border-color:#3A3A36}
.wrap{width:min(1120px,92vw);margin:0 auto}
.hero{padding:64px 0 42px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5.4vw,68px);line-height:1.08;letter-spacing:-.035em;margin:0 0 22px;max-width:820px}
.hero p{max-width:620px;color:var(--muted);font-size:15px;margin:0 0 26px}
.hero-meta{display:flex;flex-wrap:wrap;gap:22px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.hero-meta span b{color:var(--ink);font-weight:600}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:42px 0 22px}
.section-head h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0}
.section-head .note{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.survey-card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;min-height:210px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.survey-card:hover{transform:translateY(-2px);border-color:#A9A294;box-shadow:0 12px 28px rgba(20,20,18,.07)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent)}
.status i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.status.closed{color:var(--muted)}
.status.closed i{background:var(--muted)}
.status.draft{color:var(--warn)}
.status.draft i{background:var(--warn)}
.survey-card h3{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;margin:0 0 8px}
.survey-card p{color:var(--muted);font-size:13px;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.card-foot b{color:var(--accent);font-weight:600}
.empty{padding:44px 24px;border:1px dashed #BDB6A7;background:rgba(255,255,255,.4);text-align:center;border-radius:3px}
.empty h3{font-family:var(--serif);font-size:22px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:2px;font-size:13px;line-height:1.2;transition:opacity .15s ease,transform .15s ease}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:#B9B2A3}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.small{padding:7px 12px;font-size:12px}
.btn.danger{background:transparent;color:var(--warn);border-color:#D2B8A9}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
.fill-shell{width:min(760px,92vw);margin:0 auto;padding:44px 0 80px}
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:26px}
.back:hover{color:var(--ink)}
.form-head{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:30px}
.form-head .kicker{margin-bottom:12px}
.form-head h1{font-family:var(--serif);font-size:clamp(30px,4vw,46px);line-height:1.16;margin:0 0 12px}
.form-head p{color:var(--muted);margin:0;max-width:640px}
.meta-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:24px;margin-bottom:14px}
.q-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.q-no{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid #BFD2C7;background:var(--accent-2);padding:3px 7px;border-radius:2px;flex:none;margin-top:2px}
.q-title{font-size:16px;font-weight:600;line-height:1.5;margin:0}
.q-title em{font-style:normal;color:var(--warn);font-size:12px;margin-left:5px}
.q-help{font-size:12px;color:var(--muted);margin:-7px 0 14px 45px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #E1DCCF;background:#fff;border-radius:2px;margin-bottom:8px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover{border-color:#B9B2A3}
.opt input{accent-color:var(--accent);margin:3px 0 0;flex:none}
.opt span{font-size:14px;line-height:1.5}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-2)}
.rating{display:flex;flex-wrap:wrap;gap:8px}
.rating label{display:flex;align-items:center;justify-content:center;width:46px;height:42px;border:1px solid #D8D3C6;background:#fff;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:13px}
.rating label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#fff}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating-scale{display:flex;justify-content:space-between;width:100%;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:7px}
textarea,input[type=text],input[type=password],select{width:100%;border:1px solid #D8D3C6;background:#fff;border-radius:2px;padding:11px 12px;outline:none;font-size:14px}
textarea{resize:vertical;min-height:96px}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,90,74,.1)}
.form-foot{background:#EDEBE2;border:1px solid var(--line);padding:18px 20px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.form-foot .hint{font-size:12px;color:var(--muted);margin:0}
.form-error{color:var(--warn);font-size:13px;margin:14px 0 0;display:none}
.form-error.show{display:block}
.thanks{width:min(640px,92vw);margin:90px auto;text-align:center;padding:52px 36px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.thanks .mark{width:48px;height:48px;border-color:var(--accent);color:var(--accent);margin:0 auto 22px;font-size:17px}
.thanks h1{font-family:var(--serif);font-size:34px;margin:0 0 10px}
.thanks p{color:var(--muted);margin:0 0 26px}
.center-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.admin-shell{width:min(1120px,92vw);margin:0 auto;padding:38px 0 90px}
.admin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.admin-top h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:0 0 8px}
.admin-top p{color:var(--muted);margin:0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);padding:18px 20px;border-radius:3px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--serif);font-size:34px;line-height:1.2;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:3px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line);background:#EDEBE2}
.panel-head h2{font-family:var(--serif);font-size:17px;margin:0}
.panel-head .mono{font-size:9.5px}
.admin-list{padding:0 20px}
.admin-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:19px 0;border-bottom:1px solid #E5E0D4}
.admin-row:last-child{border-bottom:0}
.admin-row .info{min-width:0}
.admin-row h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 5px;line-height:1.35}
.admin-row .desc{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.admin-row .tags{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.admin-row .ops{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.login-shell{width:min(430px,92vw);margin:76px auto;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:32px}
.login-shell .kicker{margin-bottom:14px}
.login-shell h1{font-family:var(--serif);font-size:28px;margin:0 0 10px}
.login-shell p{color:var(--muted);font-size:13px;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.login-hint{margin-top:16px;padding:11px 12px;background:#EDEBE2;font-family:var(--mono);font-size:10.5px;color:#5F5B52;line-height:1.8}
.editor-shell{width:min(980px,94vw);margin:0 auto;padding:34px 0 90px}
.editor-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:26px}
.editor-card h1{font-family:var(--serif);font-size:28px;margin:0 0 6px}
.editor-card .sub{color:var(--muted);font-size:12.5px;margin:0 0 24px}
.form-grid{display:grid;grid-template-columns:1fr 200px;gap:14px}
.q-editor{border:1px solid var(--line);background:#fff;border-radius:3px;padding:16px;margin-bottom:10px}
.q-editor-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-editor-top .no{font-family:var(--mono);font-size:10px;color:var(--muted);flex:none}
.q-editor-top select{width:132px;padding:6px 8px;font-size:12px}
.q-editor-top input[type=text]{flex:1;min-width:0;padding:8px 10px;font-size:13px}
.q-editor textarea{min-height:62px;margin-top:8px;font-size:12.5px}
.q-editor .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.chk input{accent-color:var(--accent)}
.editor-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.editor-error{color:var(--warn);font-size:12.5px;margin-top:10px;display:none}
.editor-error.show{display:block}
.results-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.results-head h1{font-family:var(--serif);font-size:32px;margin:0 0 6px}
.results-head p{color:var(--muted);font-size:12.5px;margin:0}
.result-tools{display:flex;gap:8px;flex-wrap:wrap}
.summary-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;margin-bottom:12px}
.summary-card h2{font-size:16px;margin:0 0 2px}
.summary-card .sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:16px}
.bar-row{display:grid;grid-template-columns:minmax(110px,220px) 1fr 52px;align-items:center;gap:12px;margin-bottom:8px;font-size:13px}
.bar-track{height:8px;background:#E5E0D4;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
.bar-val{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.text-list{margin:0;padding:0;list-style:none}
.text-list li{border-top:1px solid #E5E0D4;padding:10px 0;font-size:13px;color:#403C34}
.text-list li:first-child{border-top:0}
.resp-table{width:100%;border-collapse:collapse;font-size:12px}
.resp-table th,.resp-table td{text-align:left;padding:10px 9px;border-bottom:1px solid #E5E0D4;vertical-align:top}
.resp-table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);background:#EDEBE2}
.resp-table td .mono{font-size:10px}
.resp-scroll{overflow:auto;max-height:360px;border:1px solid var(--line);background:#fff}
.foot{border-top:1px solid var(--line);padding:20px 0 50px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111110;color:#F7F4EA;padding:10px 18px;border-radius:2px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .admin-row{flex-direction:column;gap:12px}
  .admin-row .ops{justify-content:flex-start}
  .topbar{padding:0 18px}
  .brand span.sub{display:none}
  .nav button{padding:7px 8px;font-size:12px}
  .hero{padding:42px 0 30px}
  .bar-row{grid-template-columns:110px 1fr 46px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">FORM</span>
    <b>问卷系统</b>
    <span class="sub">CLICKBUILD / SURVEY</span>
  </div>
  <nav class="nav">
    <button id="navPublic" type="button">填写问卷</button>
    <button id="navAdmin" type="button">管理后台</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" class="toast"></div>
<script>
const CASE = {
  name: "问卷系统",
  version: "1.0.0",
  api: "/api",
  description: "公开问卷填写、后台问卷编辑、答卷收集与统计导出。",
  interfaces: ["问卷系统"],
  routes: ["GET /surveys", "GET /surveys/:id", "POST /surveys/:id/responses", "GET /admin/surveys", "POST /admin/surveys", "PUT /admin/surveys/:id", "DELETE /admin/surveys/:id", "POST /admin/surveys/:id/status", "GET /admin/surveys/:id/responses"],
  admin: { username: "admin", password: "Admin@123456" }
};

const $app = document.getElementById("app");
const $navPublic = document.getElementById("navPublic");
const $navAdmin = document.getElementById("navAdmin");
const $toast = document.getElementById("toast");
let token = localStorage.getItem("cbs_survey_token") || "";
let publicRows = [];
let currentSurvey = null;
let editorState = null;
let toastTimer = 0;

function esc(v){
  return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function txt(v){ return String(v == null ? "" : v); }
function parseJson(v, fallback){
  if (v == null || v === "") return fallback;
  if (typeof v === "object") return v;
  try { return JSON.parse(v); } catch(e){ return fallback; }
}
function listOf(data){
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.rows)) return data.rows;
  if (data && data.data && Array.isArray(data.data.rows)) return data.data.rows;
  return [];
}
function qtypeLabel(t){
  return ({single:"单选", multi:"多选", rating:"评分", text:"文本"})[t] || "单选";
}
function qOptions(q){
  if (q.type === "rating") return ["1","2","3","4","5"];
  return Array.isArray(q.options) ? q.options : [];
}
function statusOf(s){
  const n = Number(s && s.status);
  if (n === 1) return { key:"open", label:"开放中", cls:"" };
  if (n === 2) return { key:"closed", label:"已结束", cls:"closed" };
  return { key:"draft", label:"草稿", cls:"draft" };
}
function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("show"), 2200);
}
function setNav(which){
  $navPublic.classList.toggle("on", which === "public");
  $navAdmin.classList.toggle("on", which === "admin");
}
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  let body = opts.body;
  if (body != null && typeof body !== "string") {
    headers["content-type"] = "application/json";
    body = JSON.stringify(body);
  }
  if (token) headers.authorization = "Bearer " + token;
  let res;
  try {
    res = await fetch(CASE.api + path, Object.assign({}, opts, { headers, body }));
  } catch(e){
    throw new Error("无法连接服务，请确认后端已启动");
  }
  let json = {};
  try { json = await res.json(); } catch(e){ json = {}; }
  const data = (json && json.data !== undefined) ? json.data : json;
  if (!res.ok) {
    const msg = (data && (data.message || data.error)) || (json && (json.message || json.error)) || ("HTTP " + res.status);
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return data;
}
function saveToken(v){
  token = v || "";
  if (token) localStorage.setItem("cbs_survey_token", token);
  else localStorage.removeItem("cbs_survey_token");
}

async function showPublic(){
  setNav("public");
  try { if (location.search) history.replaceState(null, "", location.pathname); } catch(e) { /* ignore */ }
  let rows = [];
  try { rows = listOf(await api("/surveys")); } catch(e){
    $app.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:60px"><h3>服务暂时不可用</h3><p>' + esc(e.message) + '</p></div></div>';
    return;
  }
  publicRows = rows;
  const cards = rows.length ? rows.map(s => {
    const qn = parseJson(s.questions, []).length;
    return '<button class="survey-card" type="button" data-fill="' + esc(s.id) + '">' +
      '<div class="card-top"><span class="status"><i></i>开放中</span><span class="mono">#' + esc(String(s.id).slice(0,8)) + '</span></div>' +
      '<h3>' + esc(s.title) + '</h3><p>' + esc(s.description || "感谢你的参与，所有回答仅用于统计分析。") + '</p>' +
      '<div class="card-foot"><span>' + qn + ' 题 · ' + Number(s.response_count || 0) + ' 份答卷</span><b>开始填写 →</b></div></button>';
  }).join("") : '<div class="empty"><h3>还没有开放中的问卷</h3><p>管理员可以在后台创建问卷并发布，发布后会立即出现在这里。</p><button class="btn ghost" type="button" data-admin>进入管理后台</button></div>';
  $app.innerHTML = '<div class="wrap">' +
    '<section class="hero"><div class="kicker">Open survey / 公开征集</div>' +
    '<h1>让每个问题<br>都有答案。</h1>' +

async function submitFill(ev){
  ev.preventDefault();
  const form = ev.currentTarget;
  const err = document.getElementById("formError");
  const qs = parseJson(currentSurvey.questions, []);
  const answers = {};
  for (const q of qs) {
    if (q.type === "multi") {
      answers[q.id] = Array.from(form.querySelectorAll('input[data-qid="' + q.id + '"]:checked')).map(x => x.value);
    } else if (q.type === "text") {
      const el = form.querySelector('[data-qid="' + q.id + '"]');
      answers[q.id] = el ? el.value.trim() : "";
    } else {
      const el = form.querySelector('input[data-qid="' + q.id + '"]:checked');
      answers[q.id] = el ? el.value : "";
    }
    if (q.required) {
      const v = answers[q.id];
      if (Array.isArray(v) ? v.length === 0 : !txt(v)) {
        err.textContent = "请完成必填题：" + q.title;
        err.classList.add("show");
        const first = form.querySelector('[data-qid="' + q.id + '"]');
        if (first) first.focus();
        return;
      }
    }
  }
  const respondent = (form.querySelector('input[name="respondent"]').value || "").trim();
  try {
    const r = await api("/surveys/" + encodeURIComponent(currentSurvey.id) + "/responses", {
      method: "POST",
      body: { respondent: respondent, answers: JSON.stringify(answers) }
    });
    $app.innerHTML = '<div class="thanks"><span class="mark">OK</span><h1>提交成功</h1>' +
      '<p>你的回答已经记录。' + (r && r.id ? '答卷编号 #' + esc(String(r.id).slice(0,8)) : "") + '</p>' +
      '<div class="center-actions"><button class="btn ghost" type="button" data-public>返回问卷列表</button><button class="btn" type="button" data-fill="' + esc(currentSurvey.id) + '">再填一份</button></div></div>';
  } catch(e){
    err.textContent = e.message;
    err.classList.add("show");
  }
}

function openEditor(s){
  const isNew = !s;
  const qs = isNew ? defaultQuestions() : parseJson(s.questions, []);
  editorState = {
    id: s ? s.id : "",
    title: s ? txt(s.title) : "客户满意度调查",
    description: s ? txt(s.description) : "用一分钟告诉我们你的真实感受，所有回答仅用于改进产品。",

  };

function captureEditor(){
  const f = document.getElementById("editorForm");
  if (!f) return;
  editorState.title = f.querySelector('input[name="title"]').value;
  editorState.description = f.querySelector('textarea[name="description"]').value;
  editorState.status = Number(f.querySelector('select[name="status"]').value);
  const qs = [];
  f.querySelectorAll(".q-editor").forEach((row) => {
    const q = {
      id: row.dataset.qid || ("q" + (qs.length + 1)),
      type: row.querySelector("select[name=type]").value,
      title: row.querySelector('input[name="qtitle"]').value.trim(),
      required: row.querySelector('input[name="required"]').checked,
      options: []
    };
    const helpEl = row.querySelector('input[name="help"]');
    if (helpEl && helpEl.value.trim()) q.help = helpEl.value.trim();
    const optsEl = row.querySelector('textarea[name="options"]');
    if (optsEl && optsEl.value.trim()) {
      q.options = optsEl.value.split(/\n/).map(x => x.trim()).filter(Boolean);
    }
    if (q.type === "rating") q.options = [];
    qs.push(q);
  });
  editorState.questions = qs;
}
function renderEditor(isNew){
  setNav("admin");
  const qs = editorState.questions;
  const rows = qs.map((q,i) => {
    const needOptions = q.type !== "rating" && q.type !== "text";
    return '<div class="q-editor" data-qid="' + esc(q.id) + '"><div class="q-editor-top"><span class="no">Q' + String(i+1).padStart(2,"0") + '</span>' +
      '<select name="type" data-onchange="type">' +
      ['single','multi','rating','text'].map(t => '<option value="' + t + '"' + (q.type===t?' selected':'') + '>' + qtypeLabel(t) + '</option>').join("") + '</select>' +
      '<input type="text" name="qtitle" value="' + esc(q.title) + '" placeholder="题目内容">' +
      '<button class="btn small danger" type="button" data-remove-q="' + i + '">移除</button></div>' +
      (needOptions ? '<textarea name="options" placeholder="每行一个选项">' + esc(qOptions(q).join("\n")) + '</textarea>' : ('<p class="mono" style="margin:10px 0 0">' + (q.type === "rating" ? '固定为 1–5 分评分' : '文本题，由填写人自由输入') + '</p>')) +
      '<div class="row"><label class="chk"><input type="checkbox" name="required"' + (q.required?' checked':'') + '> 必填</label>' +
      '<input type="text" name="help" value="' + esc(q.help || "") + '" placeholder="补充说明（选填）" style="max-width:340px;padding:7px 9px;font-size:12px"></div></div>';
  }).join("");
  $app.innerHTML = '<div class="editor-shell"><button class="back" type="button" data-admin>← 返回问卷列表</button>' +
    '<div class="editor-card"><div class="kicker">' + (isNew ? 'New survey' : 'Edit survey') + '</div><h1>' + (isNew ? '新建问卷' : '编辑问卷') + '</h1><p class="sub">题目以 JSON 保存，发布后立即进入公开列表。</p>' +
    '<form id="editorForm"><div class="form-grid"><div class="field"><label>问卷标题</label><input type="text" name="title" value="' + esc(editorState.title) + '" maxlength="120"></div>' +
    '<div class="field"><label>状态</label><select name="status"><option value="1"' + (editorState.status===1?' selected':'') + '>开放中</option><option value="2"' + (editorState.status===2?' selected':'') + '>已结束</option><option value="0"' + (editorState.status===0?' selected':'') + '>草稿（公开页不显示）</option></select></div></div>' +
    '<div class="field"><label>问卷说明</label><textarea name="description" rows="3" maxlength="500">' + esc(editorState.description) + '</textarea></div>' +
    '<div class="field"><label>题目（' + qs.length + '）</label>' + rows + '</div>' +
    '<button class="btn ghost small" type="button" data-add-q>+ 添加题目</button>' +
    '<p id="editorError" class="editor-error"></p>' +
    '<div class="editor-actions"><span class="mono">保存后可在「结果」中查看统计</span><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-admin>取消</button><button class="btn accent" type="submit">保存问卷</button></div></div></form></div></div>';
  document.getElementById("editorForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    captureEditor();
    const err = document.getElementById("editorError");
    if (!editorState.title.trim()) { err.textContent = "请填写问卷标题"; err.classList.add("show"); return; }
    if (!editorState.questions.length) { err.textContent = "至少需要一道题目"; err.classList.add("show"); return; }
    for (const q of editorState.questions) {
      if (!q.title) { err.textContent = "有题目没有填写内容"; err.classList.add("show"); return; }
      if (q.type !== "rating" && q.type !== "text" && q.options.length < 2) {
        err.textContent = "选择题至少需要两个选项：" + q.title; err.classList.add("show"); return;
      }
    }
    const payload = {
      title: editorState.title.trim(),
      description: editorState.description.trim(),
      questions: JSON.stringify(editorState.questions),
      status: editorState.status
    };
    try {
      if (editorState.id) {
        await api("/admin/surveys/" + encodeURIComponent(editorState.id), { method:"PUT", body:payload });
        toast("问卷已更新");
      } else {
        await api("/admin/surveys", { method:"POST", body:Object.assign({ response_count:0 }, payload) });
        toast("问卷已创建");
      }
      await showAdmin();
    } catch(e){ err.textContent = e.message; err.classList.add("show"); }
  });
}
function addQuestion(){
  captureEditor();
  const id = "q" + (Date.now().toString(36).slice(-5));
  editorState.questions.push({ id:id, type:"single", title:"新题目", required:false, options:["选项一","选项二"] });
  renderEditor(false);
}
function removeQuestion(i){
  captureEditor();
  if (editorState.questions.length <= 1) { toast("至少保留一道题"); return; }
  editorState.questions.splice(Number(i), 1);
  renderEditor(false);
}
function changeType(i, value){
  captureEditor();
  editorState.questions[Number(i)].type = value;
  if ((value === "single" || value === "multi") && !editorState.questions[Number(i)].options.length) {
    editorState.questions[Number(i)].options = ["选项一","选项二"];
  }
  renderEditor(false);
}

async function showResults(id){
  setNav("admin");
  let surveys = [];
  try { surveys = listOf(await api("/admin/surveys")); } catch(e){ return showLogin(e.message); }
  const s = surveys.find(x => String(x.id) === String(id));
  if (!s) { toast("问卷不存在"); return showAdmin(); }
  let responses = [];
  try { responses = listOf(await api("/admin/surveys/" + encodeURIComponent(id) + "/responses")); } catch(e){ toast(e.message); }
  const qs = parseJson(s.questions, []);
  const total = responses.length;
  const cards = qs.map((q,qi) => {
    const opts = qOptions(q);
    if (q.type === "text") {
      const items = responses.map(r => parseJson(r.answers, {})[q.id]).filter(v => v != null && String(v).trim() !== "");
      return '<div class="summary-card"><h2>Q' + (qi+1) + ' · ' + esc(q.title) + '</h2><div class="sub">TEXT · ' + items.length + ' 条回答</div>' +
        (items.length ? '<ul class="text-list">' + items.slice(0,30).map(v => '<li>' + esc(v) + '</li>').join("") + '</ul>' : '<p class="mono">暂无文本回答</p>') + '</div>';
    }
    const counts = opts.map(o => ({ option:o, n:0 }));
    responses.forEach(r => {
      const a = parseJson(r.answers, {})[q.id];
      const vals = Array.isArray(a) ? a : (a == null || a === "" ? [] : [a]);
      vals.forEach(v => { const c = counts.find(x => String(x.option) === String(v)); if (c) c.n += 1; });
    });
    const base = Math.max(1, responses.filter(r => { const a = parseJson(r.answers, {})[q.id]; return Array.isArray(a) ? a.length > 0 : (a != null && a !== ""); }).length);
    const rows = counts.map(c => {
      const pct = Math.round(c.n / base * 100);
      return '<div class="bar-row"><span>' + esc(c.option) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><span class="bar-val">' + c.n + ' · ' + pct + '%</span></div>';
    }).join("");
    return '<div class="summary-card"><h2>Q' + (qi+1) + ' · ' + esc(q.title) + '</h2><div class="sub">' + qtypeLabel(q.type).toUpperCase() + ' · ' + base + ' 人作答</div>' + rows + '</div>';
  }).join("");
  const tableRows = responses.slice(0, 100).map(r => {
    const a = parseJson(r.answers, {});
    return '<tr><td class="mono">' + esc(String(r.created_at || "").replace("T"," ").slice(0,16)) + '</td><td>' + esc(r.respondent || "匿名") + '</td>' +
      qs.map(q => {
        const v = a[q.id];
        return '<td>' + esc(Array.isArray(v) ? v.join(" / ") : (v == null ? "" : v)) + '</td>';
      }).join("") + '</tr>';
  }).join("");
  $app.innerHTML = '<div class="admin-shell"><button class="back" type="button" data-admin>← 返回问卷列表</button>' +
    '<div class="results-head"><div><div class="kicker">Results</div><h1>' + esc(s.title) + '</h1><p>' + total + ' 份答卷 · ' + qs.length + ' 道题 · 状态 ' + statusOf(s).label + '</p></div>' +
    '<div class="result-tools"><button class="btn" type="button" data-copy="' + esc(s.id) + '">复制填写链接</button><button class="btn ghost" type="button" data-export="' + esc(s.id) + '">导出 CSV</button></div></div>' +
    (total ? '<div class="panel" style="margin-bottom:18px"><div class="panel-head"><h2>逐题统计</h2><span class="mono">实时来自答卷表</span></div><div style="padding:14px">' + cards + '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>答卷明细</h2><span class="mono">最多展示前 100 条</span></div><div class="resp-scroll" style="margin:14px"><table class="resp-table"><thead><tr><th>时间</th><th>填写人</th>' + qs.map(q => '<th>' + esc(q.title) + '</th>').join("") + '</tr></thead><tbody>' + tableRows + '</tbody></table></div></div>'
      : '<div class="empty"><h3>还没有答卷</h3><p>把填写链接发出去，收到第一份回答后这里会自动出现统计。</p><button class="btn ghost" type="button" data-copy="' + esc(s.id) + '">复制填写链接</button></div>') + '</div>';
}

function copyLink(id){
  const url = location.origin + location.pathname + "?s=" + encodeURIComponent(id);  const done = () => toast("填写链接已复制");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else fallbackCopy(url, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("请手动复制：" + text); }
  document.body.removeChild(ta);
}
async function deleteSurvey(id){
  if (!confirm("确定删除这份问卷？已有答卷时系统会拒绝删除，请先导出或结束问卷。")) return;
  try {
    await api("/admin/surveys/" + encodeURIComponent(id), { method:"DELETE" });
    toast("问卷已删除");
    await showAdmin();
  } catch(e){
    if (String(e.message).indexOf("HAS_RESPONSES") >= 0) toast("这份问卷已有答卷，不能删除；请先导出数据");
    else toast(e.message);
  }
}
async function toggleSurvey(id){
  let surveys = [];
  try { surveys = listOf(await api("/admin/surveys")); } catch(e){ return toast(e.message); }
  const s = surveys.find(x => String(x.id) === String(id));
  if (!s) return;
  const next = Number(s.status) === 1 ? 2 : 1;
  try {
    await api("/admin/surveys/" + encodeURIComponent(id) + "/status", { method:"POST", body:{ status:next } });
    toast(next === 1 ? "问卷已发布" : "问卷已结束");
    await showAdmin();
  } catch(e){ toast(e.message); }
}
async function doExport(id){
  let surveys = [];
  try { surveys = listOf(await api("/admin/surveys")); } catch(e){ return toast(e.message); }
  const s = surveys.find(x => String(x.id) === String(id));
  if (!s) return toast("问卷不存在");
  let responses = [];
  try { responses = listOf(await api("/admin/surveys/" + encodeURIComponent(id) + "/responses")); } catch(e){ return toast(e.message); }
  const qs = parseJson(s.questions, []);
  const cell = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  const header = ["提交时间","填写人"].concat(qs.map(q => q.title));
  const lines = [header.map(cell).join(",")];
  responses.forEach(r => {
    const a = parseJson(r.answers, {});
    const row = [String(r.created_at || "").replace("T"," ").slice(0,19), r.respondent || "匿名"].concat(qs.map(q => {
      const v = a[q.id];
      return Array.isArray(v) ? v.join(" / ") : (v == null ? "" : v);
    }));
    lines.push(row.map(cell).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (s.title || "survey") + "-答卷.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("已导出 " + responses.length + " 份答卷");
}

async function createSample(){
  const qs = defaultQuestions();
  const payload = {
    title:"客户满意度调查（示例）",
    description:"这是系统自带的示例问卷，发布后即可公开填写。可以直接编辑题目，或删除后新建自己的问卷。",
    questions: JSON.stringify(qs),
    status: 1,
    response_count: 0
  };
  try {
    await api("/admin/surveys", { method:"POST", body:payload });
    toast("示例问卷已创建并发布");
    await showAdmin();
  } catch(e){ toast(e.message); }
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-public],[data-admin],[data-fill],[data-new],[data-sample],[data-edit],[data-results],[data-toggle],[data-delete],[data-refresh],[data-logout],[data-copy],[data-export],[data-back],[data-add-q],[data-remove-q]");
  if (!el) return;
  if (el.hasAttribute("data-public")) return showPublic();
  if (el.hasAttribute("data-admin")) return showAdmin();
  if (el.hasAttribute("data-fill")) return showFill(el.getAttribute("data-fill"));
  if (el.hasAttribute("data-new")) return openEditor(null);
  if (el.hasAttribute("data-sample")) return createSample();
  if (el.hasAttribute("data-edit")) {
    const id = el.getAttribute("data-edit");
    return api("/admin/surveys").then(d => {
      const s = listOf(d).find(x => String(x.id) === String(id));
      if (s) openEditor(s); else toast("问卷不存在");
    }).catch(e => toast(e.message));
  }
  if (el.hasAttribute("data-results")) return showResults(el.getAttribute("data-results"));
  if (el.hasAttribute("data-toggle")) return toggleSurvey(el.getAttribute("data-toggle"));
  if (el.hasAttribute("data-delete")) return deleteSurvey(el.getAttribute("data-delete"));
  if (el.hasAttribute("data-refresh")) return showAdmin();
  if (el.hasAttribute("data-copy")) return copyLink(el.getAttribute("data-copy"));
  if (el.hasAttribute("data-export")) return doExport(el.getAttribute("data-export"));
  if (el.hasAttribute("data-logout")) { saveToken(""); return showLogin(""); }
  if (el.hasAttribute("data-add-q")) return addQuestion();
  if (el.hasAttribute("data-remove-q")) return removeQuestion(el.getAttribute("data-remove-q"));
});
document.addEventListener("change", (ev) => {
  const sel = ev.target.closest("select[data-onchange=type]");
  if (!sel) return;
  const row = sel.closest(".q-editor");
  const index = Array.from(document.querySelectorAll(".q-editor")).indexOf(row);
  changeType(index, sel.value);
});
$navPublic.addEventListener("click", showPublic);
$navAdmin.addEventListener("click", showAdmin);

(function boot(){
  const id = new URLSearchParams(location.search).get("s");
  if (id) showFill(id);
  else showPublic();
})();
</script>
