<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动报名 · ClickBuild</title>
<style>
:root{
  --paper:#F4F2EB; --ink:#141412; --muted:#666157; --line:#D8D3C6; --card:#FBF9F3;
  --accent:#9A4E2C; --accent-2:#F0E1D8; --warn:#A24D2A;
  --mono:"SFMono-Regular","Cascadia Code","Consolas",monospace;
  --serif:"Songti SC","Noto Serif SC","Georgia",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:#111110;color:#F7F4EA;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid #2A2A27}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #6E6A60;border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#D8D4C8}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.brand span.sub{font-family:var(--mono);font-size:10px;color:#8E8B82;letter-spacing:.16em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:6px}
.nav button{background:none;border:1px solid transparent;color:#C9C5B9;padding:7px 12px;border-radius:2px;font-size:13px}
.nav button:hover{color:#fff;border-color:#3A3A36}
.nav button.on{color:#fff;background:#2A2A27;border-color:#3A3A36}
.wrap{width:min(1120px,92vw);margin:0 auto}
.hero{padding:64px 0 42px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5.4vw,68px);line-height:1.08;letter-spacing:-.035em;margin:0 0 22px;max-width:820px}
.hero p{max-width:640px;color:var(--muted);font-size:15px;margin:0 0 26px}
.hero-meta{display:flex;flex-wrap:wrap;gap:22px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.hero-meta span b{color:var(--ink);font-weight:600}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:42px 0 22px}
.section-head h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0}
.section-head .note{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.event-card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:0;overflow:hidden;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.event-card:hover{transform:translateY(-2px);border-color:#B6A597;box-shadow:0 12px 28px rgba(20,20,18,.07)}
.event-card .band{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 22px;background:#EDE8DF;border-bottom:1px solid var(--line)}
.event-card .band .date{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;color:var(--accent)}
.event-card .band .left{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em}
.event-card .body{padding:20px 22px 0;flex:1}
.event-card h3{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;margin:0 0 8px}
.event-card p.desc{color:var(--muted);font-size:13px;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-card .place{display:flex;align-items:center;gap:7px;font-size:12px;color:#4F4A40;margin-bottom:14px}
.event-card .place i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block;flex:none}
.event-card .meter{padding:0 22px 18px}
.meter-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-bottom:6px}
.track{height:6px;background:#E3DCD0;border-radius:99px;overflow:hidden}
.track .fill{height:100%;background:var(--accent);border-radius:99px}
.event-card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.event-card .foot b{color:var(--accent);font-weight:600}
.event-card.full .foot b{color:var(--muted)}
.empty{padding:44px 24px;border:1px dashed #BDB6A7;background:rgba(255,255,255,.4);text-align:center;border-radius:3px}
.empty h3{font-family:var(--serif);font-size:22px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:2px;font-size:13px;line-height:1.2;transition:opacity .15s ease,transform .15s ease}
.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:#B9B2A3}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.small{padding:7px 12px;font-size:12px}
.btn.danger{background:transparent;color:var(--warn);border-color:#D2B8A9}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:26px}
.back:hover{color:var(--ink)}
.form-shell{width:min(760px,92vw);margin:0 auto;padding:44px 0 80px}
.form-head{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:30px}
.form-head .kicker{margin-bottom:12px}
.form-head h1{font-family:var(--serif);font-size:clamp(30px,4vw,46px);line-height:1.16;margin:0 0 12px}
.form-head p{color:var(--muted);margin:0;max-width:640px}
.meta-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.event-brief{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.brief{background:var(--card);border:1px solid var(--line);padding:13px 15px;border-radius:2px}
.brief .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted)}
.brief .v{font-size:13px;margin-top:3px;line-height:1.45}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:24px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.field label em{font-style:normal;color:var(--warn);margin-left:4px}
textarea,input[type=text],input[type=tel],input[type=password],input[type=number],input[type=datetime-local],select{width:100%;border:1px solid #D8D3C6;background:#fff;border-radius:2px;padding:11px 12px;outline:none;font-size:14px}
textarea{resize:vertical;min-height:88px}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(154,78,44,.1)}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.form-foot .hint{font-size:12px;color:var(--muted);margin:0}
.form-error{color:var(--warn);font-size:13px;margin:14px 0 0;display:none}
.form-error.show{display:block}
.thanks{width:min(640px,92vw);margin:90px auto;text-align:center;padding:52px 36px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.thanks .mark{width:48px;height:48px;border-color:var(--accent);color:var(--accent);margin:0 auto 22px;font-size:17px}
.thanks h1{font-family:var(--serif);font-size:34px;margin:0 0 10px}
.thanks p{color:var(--muted);margin:0 0 26px}
.center-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.admin-shell{width:min(1120px,92vw);margin:0 auto;padding:38px 0 90px}
.admin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.admin-top h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:0 0 8px}
.admin-top p{color:var(--muted);margin:0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);padding:18px 20px;border-radius:3px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--serif);font-size:34px;line-height:1.2;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:3px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line);background:#EDE8DF}
.panel-head h2{font-family:var(--serif);font-size:17px;margin:0}
.panel-head .mono{font-size:9.5px}
.admin-list{padding:0 20px}
.admin-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:19px 0;border-bottom:1px solid #E5E0D4}
.admin-row:last-child{border-bottom:0}
.admin-row .info{min-width:0}
.admin-row h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 5px;line-height:1.35}
.admin-row .desc{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.admin-row .tags{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.admin-row .ops{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent)}
.status i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.status.closed{color:var(--muted)}.status.closed i{background:var(--muted)}
.status.draft{color:var(--warn)}.status.draft i{background:var(--warn)}
.login-shell{width:min(430px,92vw);margin:76px auto;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:32px}
.login-shell .kicker{margin-bottom:14px}
.login-shell h1{font-family:var(--serif);font-size:28px;margin:0 0 10px}
.login-shell p{color:var(--muted);font-size:13px;margin:0 0 22px}
.login-hint{margin-top:16px;padding:11px 12px;background:#EDE8DF;font-family:var(--mono);font-size:10.5px;color:#5F5B52;line-height:1.8}
.editor-shell{width:min(900px,94vw);margin:0 auto;padding:34px 0 90px}
.editor-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:26px}
.editor-card h1{font-family:var(--serif);font-size:28px;margin:0 0 6px}
.editor-card .sub{color:var(--muted);font-size:12.5px;margin:0 0 24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.editor-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.editor-error{color:var(--warn);font-size:12.5px;margin-top:10px;display:none}
.editor-error.show{display:block}
.results-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.results-head h1{font-family:var(--serif);font-size:32px;margin:0 0 6px}
.results-head p{color:var(--muted);font-size:12.5px;margin:0}
.result-tools{display:flex;gap:8px;flex-wrap:wrap}
.event-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.event-summary .stat{padding:14px 16px}
.event-summary .stat .v{font-size:26px}
.resp-table{width:100%;border-collapse:collapse;font-size:12px}
.resp-table th,.resp-table td{text-align:left;padding:10px 9px;border-bottom:1px solid #E5E0D4;vertical-align:top}
.resp-table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);background:#EDE8DF}
.resp-table td .mono{font-size:10px}
.resp-scroll{overflow:auto;max-height:420px;border:1px solid var(--line);background:#fff}
.resp-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.foot{border-top:1px solid var(--line);padding:20px 0 50px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111110;color:#F7F4EA;padding:10px 18px;border-radius:2px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
  .event-brief{grid-template-columns:1fr}.event-summary{grid-template-columns:1fr 1fr}
  .admin-row{flex-direction:column;gap:12px}.admin-row .ops{justify-content:flex-start}
  .topbar{padding:0 18px}.brand span.sub{display:none}.nav button{padding:7px 8px;font-size:12px}
  .hero{padding:42px 0 30px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">JOIN</span>
    <b>活动报名</b>
    <span class="sub">CLICKBUILD / SIGNUP</span>
  </div>
  <nav class="nav">
    <button id="navPublic" type="button">活动列表</button>
    <button id="navAdmin" type="button">管理后台</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" class="toast"></div>
<script>
const CASE = {
  name: "活动报名",
  version: "1.0.0",
  api: "/api",
  description: "公开报名、名额与重复手机号校验、后台发布、报名名单与 CSV 导出。",
  interfaces: ["活动报名"],
  routes: ["GET /events", "GET /events/:id", "POST /events/:id/signups", "GET /admin/events", "POST /admin/events", "PUT /admin/events/:id", "DELETE /admin/events/:id", "POST /admin/events/:id/status", "GET /admin/events/:id/signups"],
  admin: { username: "admin", password: "Admin@123456" }
};

const $app = document.getElementById("app");
const $navPublic = document.getElementById("navPublic");
const $navAdmin = document.getElementById("navAdmin");
const $toast = document.getElementById("toast");
let token = localStorage.getItem("cbs_signup_token") || "";
let currentEvent = null;
let editorState = null;
let toastTimer = 0;

function esc(v){
  return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function txt(v){ return String(v == null ? "" : v); }
function parseJson(v, fallback){
  if (v == null || v === "") return fallback;
  if (typeof v === "object") return v;
  try { return JSON.parse(v); } catch(e){ return fallback; }
}
function listOf(data){
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.rows)) return data.rows;
  if (data && data.data && Array.isArray(data.data.rows)) return data.data.rows;
  return [];
}
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fmtDate(v){
  if (!v) return "时间待定";
  const s = String(v).replace("T", " ");
  const d = new Date(s.replace(" ", "T"));
  if (isNaN(d.getTime())) return s.slice(0,16);
  const pad = n => String(n).padStart(2,"0");
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function toInputDate(v){
  if (!v) return "";
  return String(v).replace("T"," ").slice(0,16).replace(" ","T");
}
function toDbDate(v){
  if (!v) return "";
  return String(v).replace("T"," ") + (String(v).length === 16 ? ":00" : "");
}
function statusOf(s){
  const n = Number(s && s.status);
  if (n === 1) return { key:"open", label:"开放中", cls:"" };
  if (n === 2) return { key:"closed", label:"已结束", cls:"closed" };
  return { key:"draft", label:"草稿", cls:"draft" };
}
function remainOf(e){
  const cap = num(e.capacity), c = num(e.registered_count);
  return cap > 0 ? Math.max(0, cap - c) : -1;
}
function isFull(e){
  const cap = num(e.capacity), c = num(e.registered_count);
  return cap > 0 && c >= cap;
}
function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("show"), 2200);
}
function setNav(which){
  $navPublic.classList.toggle("on", which === "public");
  $navAdmin.classList.toggle("on", which === "admin");
}
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  let body = opts.body;
  if (body != null && typeof body !== "string") {
    headers["content-type"] = "application/json";
    body = JSON.stringify(body);
  }
  if (token) headers.authorization = "Bearer " + token;
  let res;
  try {
    res = await fetch(CASE.api + path, Object.assign({}, opts, { headers, body }));
  } catch(e){
    throw new Error("无法连接服务，请确认后端已启动");
  }
  let json = {};
  try { json = await res.json(); } catch(e){ json = {}; }
  const data = (json && json.data !== undefined) ? json.data : json;
  if (!res.ok) {
    const msg = (data && (data.message || data.error)) || (json && (json.message || json.error)) || ("HTTP " + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.code = data && (data.error || data.code);
    throw err;
  }
  return data;
}
function saveToken(v){
  token = v || "";
  if (token) localStorage.setItem("cbs_signup_token", token);
  else localStorage.removeItem("cbs_signup_token");
}

async function showPublic(){
  setNav("public");
  try { if (location.search) history.replaceState(null, "", location.pathname); } catch(e) { /* ignore */ }
  let rows = [];
  try { rows = listOf(await api("/events")); } catch(e){
    $app.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:60px"><h3>服务暂时不可用</h3><p>' + esc(e.message) + '</p></div></div>';
    return;
  }
  const cards = rows.length ? rows.map(e => {
    const st = statusOf(e);
    const left = remainOf(e);
    const full = isFull(e);
    const cap = num(e.capacity);
    const pct = cap > 0 ? Math.min(100, Math.round(num(e.registered_count) / cap * 100)) : 0;
    return '<button class="event-card' + (full ? ' full' : '') + '" type="button" data-open="' + esc(e.id) + '">' +
      '<div class="band"><span class="date">' + esc(fmtDate(e.start_at)) + '</span><span class="left">' + (cap > 0 ? '名额 ' + cap : '不限名额') + '</span></div>' +
      '<div class="body"><h3>' + esc(e.title) + '</h3><p class="desc">' + esc(e.description || "欢迎报名参加，请填写真实联系方式。") + '</p>' +
      '<div class="place"><i></i>' + esc(e.location || "地点待定") + '</div></div>' +
      '<div class="meter"><div class="meter-line"><span>已报名 ' + num(e.registered_count) + ' 人</span><span>' + (full ? '名额已满' : (left >= 0 ? '还剩 ' + left + ' 席' : '不限名额')) + '</span></div><div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>' +
      '<div class="foot"><span>' + st.label + ' · #' + esc(String(e.id).slice(-4)) + '</span><b>' + (full ? '查看详情 →' : '我要报名 →') + '</b></div></button>';
  }).join("") : '<div class="empty"><h3>还没有开放报名的活动</h3><p>管理员可以在后台创建活动并开放报名，开放后会立即出现在这里。</p><button class="btn ghost" type="button" data-admin>进入管理后台</button></div>';
  const totalCap = rows.reduce((a,e) => a + num(e.capacity), 0);
  const totalReg = rows.reduce((a,e) => a + num(e.registered_count), 0);
  $app.innerHTML = '<div class="wrap"><section class="hero"><div class="kicker">Open registration / 公开报名</div>' +
    '<h1>一场活动，<br>从报名开始。</h1>' +
    '<p>发布活动、设置名额、公开报名、导出名单。填写无需登录，管理需要管理员账号。</p>' +
    '<div class="hero-meta"><span><b>' + rows.length + '</b> 场开放活动</span><span><b>' + (totalCap || "不限") + '</b> 个名额</span><span><b>' + totalReg + '</b> 人已报名</span></div></section>' +
    '<div class="section-head"><h2>开放中的活动</h2><span class="note">SELECT · ' + rows.length + ' ROWS</span></div>' +
    '<div class="grid">' + cards + '</div>' +
    '<div class="foot"><span>CLICKBUILD / SIGNUP SYSTEM</span><span>公开报名 · 名额控制 · 名单导出</span></div></div>';
}

async function showEvent(id){
  setNav("public");
  let e;
  try { e = await api("/events/" + encodeURIComponent(id)); } catch(err){
    $app.innerHTML = '<div class="form-shell"><button class="back" type="button" data-public>← 返回活动列表</button><div class="empty"><h3>活动不存在</h3><p>' + esc(err.message) + '</p></div></div>';
    return;
  }
  currentEvent = e;
  const full = isFull(e);
  const left = remainOf(e);
  const cap = num(e.capacity);
  const reg = num(e.registered_count);
  const head = '<div class="form-shell"><button class="back" type="button" data-public>← 返回活动列表</button>' +
    '<div class="form-head"><div class="kicker">Signup / 公开报名</div><h1>' + esc(e.title) + '</h1><p>' + esc(e.description || "请填写真实信息，方便现场签到。") + '</p>' +
    '<div class="meta-row"><span>' + esc(fmtDate(e.start_at)) + '</span><span>' + esc(e.location || "地点待定") + '</span><span>' + (cap > 0 ? reg + ' / ' + cap + ' 人' : reg + ' 人已报名') + '</span></div></div>' +
    '<div class="event-brief"><div class="brief"><div class="k">开始时间</div><div class="v">' + esc(fmtDate(e.start_at)) + '</div></div>' +
    '<div class="brief"><div class="k">地点</div><div class="v">' + esc(e.location || "待定") + '</div></div>' +
    '<div class="brief"><div class="k">名额</div><div class="v">' + (cap > 0 ? (full ? '已满' : '还剩 ' + left + ' 席') : '不限') + '</div></div></div>';
  if (full) {
    $app.innerHTML = head + '<div class="empty"><h3>名额已满</h3><p>这场活动的报名人数已经达到上限，可以返回列表看看其他活动。</p><button class="btn ghost" type="button" data-public>返回活动列表</button></div></div>';
    return;
  }
  $app.innerHTML = head + '<form id="signupForm" class="form-card" novalidate>' +
    '<div class="field"><label>姓名<em>*</em></label><input type="text" name="name" maxlength="40" placeholder="怎么称呼你" autocomplete="name"></div>' +
    '<div class="field"><label>手机号<em>*</em></label><input type="tel" name="phone" maxlength="20" placeholder="用于签到与活动通知" autocomplete="tel"></div>' +
    '<div class="field"><label>备注</label><textarea name="remark" maxlength="200" rows="3" placeholder="公司 / 职位 / 想了解的问题（选填）"></textarea></div>' +
    '<p id="formError" class="form-error"></p>' +
    '<div class="form-foot"><p class="hint">同一个手机号对同一场活动只能报名一次。提交后如需取消，请联系主办方。</p><button class="btn accent" type="submit">确认报名</button></div></form></div>';
  document.getElementById("signupForm").addEventListener("submit", submitSignup);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function submitSignup(ev){
  ev.preventDefault();
  const f = ev.currentTarget;
  const err = document.getElementById("formError");
  const name = (f.querySelector('input[name="name"]').value || "").trim();
  const phone = (f.querySelector('input[name="phone"]').value || "").trim();
  const remark = (f.querySelector('textarea[name="remark"]').value || "").trim();
  if (!name) { err.textContent = "请填写姓名"; err.classList.add("show"); return; }
  if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = "请填写 11 位手机号"; err.classList.add("show"); return; }
  try {
    await api("/events/" + encodeURIComponent(currentEvent.id) + "/signups", { method:"POST", body:{ name, phone, remark } });
    $app.innerHTML = '<div class="thanks"><span class="mark">OK</span><h1>报名成功</h1><p>' + esc(name) + '，' + esc(fmtDate(currentEvent.start_at)) + ' 在 ' + esc(currentEvent.location || "活动现场") + ' 见。</p>' +
      '<div class="center-actions"><button class="btn ghost" type="button" data-public>返回活动列表</button><button class="btn" type="button" data-open="' + esc(currentEvent.id) + '">再报一人</button></div></div>';
  } catch(e){
    if (e.code === "DUPLICATE_PHONE") err.textContent = "这个手机号已经报名过了";
    else if (e.code === "EVENT_FULL") err.textContent = "名额刚好满了，可以关注下一场";
    else if (e.code === "EVENT_CLOSED") err.textContent = "活动已结束，无法报名";
    else err.textContent = e.message;
    err.classList.add("show");
  }
}

function showLogin(message){
  setNav("admin");
  $app.innerHTML = '<div class="login-shell"><div class="kicker">Admin / 管理入口</div><h1>登录管理后台</h1>' +
    '<p>使用服务自带的管理员账号登录。登录后可发布活动、查看名单与导出。</p>' +
    (message ? '<p class="form-error show">' + esc(message) + '</p>' : '') +
    '<form id="loginForm"><div class="field"><label>账号</label><input type="text" name="username" value="admin" autocomplete="username"></div>' +
    '<div class="field"><label>密码</label><input type="password" name="password" placeholder="Admin@123456" autocomplete="current-password"></div>' +
    '<button class="btn" type="submit" style="width:100%;margin-top:6px">登录</button></form>' +
    '<div class="login-hint">默认管理员：admin / Admin@123456<br>第一次登录会自动创建该账号，密码以 SM4 保存在 rg_admin。</div></div>';
  document.getElementById("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.currentTarget;
    const username = f.querySelector('input[name="username"]').value.trim();
    const password = f.querySelector('input[name="password"]').value;
    try {
      const data = await api("/admin/login", { method:"POST", body:{ username, password } });
      if (!data || !data.token) throw new Error("登录响应缺少 token");
      saveToken(data.token);
      await showAdmin();
    } catch(e){ showLogin(e.message); }
  });
}

async function showAdmin(){
  setNav("admin");
  if (!token) return showLogin("");
  let rows = [];
  try { rows = listOf(await api("/admin/events")); } catch(e){
    if (e.status === 401 || e.status === 403) { saveToken(""); return showLogin("登录已过期，请重新登录"); }
    return showLogin(e.message);
  }
  const open = rows.filter(e => Number(e.status) === 1).length;
  const signups = rows.reduce((a,e) => a + num(e.registered_count), 0);
  const list = rows.length ? rows.map(e => {
    const st = statusOf(e);
    const cap = num(e.capacity);
    return '<div class="admin-row"><div class="info"><span class="status ' + st.cls + '"><i></i>' + st.label + '</span>' +
      '<h3 style="margin-top:6px">' + esc(e.title) + '</h3><p class="desc">' + esc(e.description || "暂无说明") + '</p>' +
      '<div class="tags"><span>' + esc(fmtDate(e.start_at)) + '</span><span>' + esc(e.location || "地点待定") + '</span><span>' + num(e.registered_count) + ' / ' + (cap > 0 ? cap : "不限") + '</span></div></div>' +
      '<div class="ops"><button class="btn small ghost" type="button" data-edit="' + esc(e.id) + '">编辑</button>' +
      '<button class="btn small ghost" type="button" data-results="' + esc(e.id) + '">名单</button>' +
      '<button class="btn small ghost" type="button" data-toggle="' + esc(e.id) + '">' + (Number(e.status) === 1 ? '结束' : '开放') + '</button>' +
      '<button class="btn small danger" type="button" data-delete="' + esc(e.id) + '">删除</button></div></div>';
  }).join("") : '<div class="empty" style="margin:18px 0 24px"><h3>还没有活动</h3><p>先创建一场示例活动，开放后即可公开报名。</p><button class="btn accent" type="button" data-sample>一键创建示例活动</button></div>';
  $app.innerHTML = '<div class="admin-shell"><div class="admin-top"><div><div class="kicker">Admin console</div><h1>活动管理</h1><p>发布活动、控制名额、查看报名名单并导出 CSV。</p></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn accent" type="button" data-new>新建活动</button><button class="btn ghost" type="button" data-refresh>刷新</button><button class="btn ghost" type="button" data-logout>退出</button></div></div>' +
    '<div class="stats"><div class="stat"><div class="k">全部活动</div><div class="v">' + rows.length + '</div></div><div class="stat"><div class="k">开放中</div><div class="v">' + open + '</div></div><div class="stat"><div class="k">累计报名</div><div class="v">' + signups + '</div></div></div>' +
    '<div class="panel"><div class="panel-head"><h2>全部活动</h2><span class="mono">' + rows.length + ' 场 · 点击名单查看报名</span></div><div class="admin-list">' + list + '</div></div></div>';
}

function defaultEvent(){
  const d = new Date();
  d.setDate(d.getDate() + 7);
  d.setHours(14, 0, 0, 0);
  const pad = n => String(n).padStart(2,"0");
  const start = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  return {
    title: "产品体验日 · 昆明站",
    description: "一次小规模的产品体验与交流，现场会演示接口工作台、前端工坊和生成服务。",
    location: "昆明 · 五华区 · 创意园 A 座",
    start_at: start,
    capacity: 40,
    status: 1
  };
}
function openEditor(e){
  const isNew = !e;
  editorState = e ? {
    id: e.id, title: txt(e.title), description: txt(e.description), location: txt(e.location),
    start_at: toInputDate(e.start_at), capacity: num(e.capacity), status: Number(e.status)
  } : Object.assign(defaultEvent(), { id: "" });
  renderEditor(isNew);
}
function renderEditor(isNew){
  setNav("admin");
  const s = editorState;
  $app.innerHTML = '<div class="editor-shell"><button class="back" type="button" data-admin>← 返回活动列表</button>' +
    '<div class="editor-card"><div class="kicker">' + (isNew ? 'New event' : 'Edit event') + '</div><h1>' + (isNew ? '新建活动' : '编辑活动') + '</h1><p class="sub">开放状态的活动会立即出现在公开列表；名额设为 0 表示不限。</p>' +
    '<form id="eventForm"><div class="field"><label>活动标题</label><input type="text" name="title" value="' + esc(s.title) + '" maxlength="100"></div>' +
    '<div class="field"><label>活动说明</label><textarea name="description" rows="3" maxlength="500">' + esc(s.description) + '</textarea></div>' +
    '<div class="form-grid"><div class="field"><label>地点</label><input type="text" name="location" value="' + esc(s.location) + '" maxlength="120"></div>' +
    '<div class="field"><label>开始时间</label><input type="datetime-local" name="start_at" value="' + esc(s.start_at) + '"></div></div>' +
    '<div class="form-grid"><div class="field"><label>名额（0 = 不限）</label><input type="number" name="capacity" min="0" step="1" value="' + s.capacity + '"></div>' +
    '<div class="field"><label>状态</label><select name="status"><option value="1"' + (s.status===1?' selected':'') + '>开放报名</option><option value="2"' + (s.status===2?' selected':'') + '>已结束</option><option value="0"' + (s.status===0?' selected':'') + '>草稿（公开页不显示）</option></select></div></div>' +
    '<p id="editorError" class="editor-error"></p>' +
    '<div class="editor-actions"><span class="mono">保存后可在「名单」中查看报名</span><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-admin>取消</button><button class="btn accent" type="submit">保存活动</button></div></div></form></div></div>';
  document.getElementById("eventForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.currentTarget;
    const err = document.getElementById("editorError");
    const payload = {
      title: (f.querySelector('input[name="title"]').value || "").trim(),
      description: (f.querySelector('textarea[name="description"]').value || "").trim(),
      location: (f.querySelector('input[name="location"]').value || "").trim(),
      start_at: toDbDate(f.querySelector('input[name="start_at"]').value),
      capacity: Number(f.querySelector('input[name="capacity"]').value || 0),
      status: Number(f.querySelector('select[name="status"]').value)
    };
    if (!payload.title) { err.textContent = "请填写活动标题"; err.classList.add("show"); return; }
    if (!payload.start_at) { err.textContent = "请选择开始时间"; err.classList.add("show"); return; }
    try {
      if (editorState.id) {
        await api("/admin/events/" + encodeURIComponent(editorState.id), { method:"PUT", body:payload });
        toast("活动已更新");
      } else {
        await api("/admin/events", { method:"POST", body:Object.assign({ registered_count:0 }, payload) });
        toast("活动已创建");
      }
      await showAdmin();
    } catch(e){ err.textContent = e.message; err.classList.add("show"); }
  });
}

async function showResults(id){
  setNav("admin");
  let events = [];
  try { events = listOf(await api("/admin/events")); } catch(e){ return showLogin(e.message); }
  const e = events.find(x => String(x.id) === String(id));
  if (!e) { toast("活动不存在"); return showAdmin(); }
  let rows = [];
  try { rows = listOf(await api("/admin/events/" + encodeURIComponent(id) + "/signups")); } catch(err){ toast(err.message); }
  const cap = num(e.capacity);
  const reg = num(e.registered_count);
  const left = cap > 0 ? Math.max(0, cap - reg) : -1;
  const pct = cap > 0 ? Math.min(100, Math.round(reg / cap * 100)) : 0;
  const table = rows.length ? '<div class="resp-scroll" style="margin:14px"><table class="resp-table"><thead><tr><th>报名时间</th><th>姓名</th><th>手机号</th><th>备注</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td class="mono">' + esc(String(r.created_at || "").replace("T"," ").slice(0,16)) + '</td><td>' + esc(r.name) + '</td><td class="mono">' + esc(r.phone) + '</td><td>' + esc(r.remark || "—") + '</td></tr>').join("") +
    '</tbody></table></div>' : '<div class="resp-empty">还没有人报名。复制报名链接发出去，收到第一份报名后这里会自动出现名单。</div>';
  $app.innerHTML = '<div class="admin-shell"><button class="back" type="button" data-admin>← 返回活动列表</button>' +
    '<div class="results-head"><div><div class="kicker">Signups</div><h1>' + esc(e.title) + '</h1><p>' + esc(fmtDate(e.start_at)) + ' · ' + esc(e.location || "地点待定") + ' · ' + statusOf(e).label + '</p></div>' +
    '<div class="result-tools"><button class="btn" type="button" data-copy="' + esc(e.id) + '">复制报名链接</button><button class="btn ghost" type="button" data-export="' + esc(e.id) + '">导出 CSV</button></div></div>' +
    '<div class="event-summary"><div class="stat"><div class="k">已报名</div><div class="v">' + reg + '</div></div>' +
    '<div class="stat"><div class="k">名额</div><div class="v">' + (cap > 0 ? cap : "不限") + '</div></div>' +
    '<div class="stat"><div class="k">剩余</div><div class="v">' + (left < 0 ? "—" : left) + '</div></div>' +
    '<div class="stat"><div class="k">报名率</div><div class="v">' + (cap > 0 ? pct + "%" : "—") + '</div></div></div>' +
    '<div class="panel"><div class="panel-head"><h2>报名名单</h2><span class="mono">' + rows.length + ' 条 · 最多展示 500 条</span></div>' + table + '</div></div>';
}

function copyLink(id){
  const url = location.origin + location.pathname + "?e=" + encodeURIComponent(id);
  const done = () => toast("报名链接已复制");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else fallbackCopy(url, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("请手动复制：" + text); }
  document.body.removeChild(ta);
}
async function deleteEvent(id){
  if (!confirm("确定删除这场活动？已有报名记录时系统会拒绝删除，请先导出名单。")) return;
  try {
    await api("/admin/events/" + encodeURIComponent(id), { method:"DELETE" });
    toast("活动已删除");
    await showAdmin();
  } catch(e){
    if (e.code === "HAS_SIGNUPS" || String(e.message).includes("HAS_SIGNUPS")) toast("已有报名记录，不能删除；请先导出名单");
    else toast(e.message);
  }
}
async function toggleEvent(id){
  let events = [];
  try { events = listOf(await api("/admin/events")); } catch(e){ return toast(e.message); }
  const e = events.find(x => String(x.id) === String(id));
  if (!e) return;
  const next = Number(e.status) === 1 ? 2 : 1;
  try {
    await api("/admin/events/" + encodeURIComponent(id) + "/status", { method:"POST", body:{ status:next } });
    toast(next === 1 ? "活动已开放" : "活动已结束");
    await showAdmin();
  } catch(err){ toast(err.message); }
}
async function doExport(id){
  let events = [];
  try { events = listOf(await api("/admin/events")); } catch(e){ return toast(e.message); }
  const e = events.find(x => String(x.id) === String(id));
  if (!e) return toast("活动不存在");
  let rows = [];
  try { rows = listOf(await api("/admin/events/" + encodeURIComponent(id) + "/signups")); } catch(err){ return toast(err.message); }
  const cell = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  const lines = [["报名时间","姓名","手机号","备注"].map(cell).join(",")];
  rows.forEach(r => lines.push([String(r.created_at || "").replace("T"," ").slice(0,19), r.name || "", r.phone || "", r.remark || ""].map(cell).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (e.title || "signups") + "-报名名单.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("已导出 " + rows.length + " 条报名");
}
async function createSample(){
  const s = defaultEvent();
  try {
    await api("/admin/events", { method:"POST", body:Object.assign({ registered_count:0 }, s) });
    toast("示例活动已创建并开放报名");
    await showAdmin();
  } catch(e){ toast(e.message); }
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-public],[data-admin],[data-open],[data-new],[data-sample],[data-edit],[data-results],[data-toggle],[data-delete],[data-refresh],[data-logout],[data-copy],[data-export]");
  if (!el) return;
  if (el.hasAttribute("data-public")) return showPublic();
  if (el.hasAttribute("data-admin")) return showAdmin();
  if (el.hasAttribute("data-open")) return showEvent(el.getAttribute("data-open"));
  if (el.hasAttribute("data-new")) return openEditor(null);
  if (el.hasAttribute("data-sample")) return createSample();
  if (el.hasAttribute("data-edit")) {
    const id = el.getAttribute("data-edit");
    return api("/admin/events").then(d => {
      const e = listOf(d).find(x => String(x.id) === String(id));
      if (e) openEditor(e); else toast("活动不存在");
    }).catch(e => toast(e.message));
  }
  if (el.hasAttribute("data-results")) return showResults(el.getAttribute("data-results"));
  if (el.hasAttribute("data-toggle")) return toggleEvent(el.getAttribute("data-toggle"));
  if (el.hasAttribute("data-delete")) return deleteEvent(el.getAttribute("data-delete"));
  if (el.hasAttribute("data-refresh")) return showAdmin();
  if (el.hasAttribute("data-copy")) return copyLink(el.getAttribute("data-copy"));
  if (el.hasAttribute("data-export")) return doExport(el.getAttribute("data-export"));
  if (el.hasAttribute("data-logout")) { saveToken(""); return showLogin(""); }
});
$navPublic.addEventListener("click", showPublic);
$navAdmin.addEventListener("click", showAdmin);

(function boot(){
  const id = new URLSearchParams(location.search).get("e");
  if (id) showEvent(id);
  else showPublic();
})();
</script>
