name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package version v$version"
          }
          "Release version: $version" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore bundled services
        shell: pwsh
        run: |
          $marker = "vendor/services/MariaDB/bin/mariadbd.exe"
          if (Test-Path $marker) { Write-Host "bundled services already present"; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP "clickbuild-services.zip"
          $url = "https://github.com/yxpil/ClickBuildServer/releases/download/services-v1/vendor-services.zip"
          curl.exe -L --fail --retry 3 -o $zip $url
          New-Item -ItemType Directory -Force vendor | Out-Null
          tar -xf $zip -C vendor
          node tools/check-services.js

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm run test:ci

      - name: Build NSIS installer
        run: npm run dist -- --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Join-Path "dist" "ClickBuildServer-Setup-$version.exe"
          $blockmap = "$exe.blockmap"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing installer: $exe" }
          if (-not (Test-Path -LiteralPath $blockmap)) { throw "Missing blockmap: $blockmap" }
          $file = Get-Item -LiteralPath $exe
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          $checksum = "$($file.FullName).sha256"
          Set-Content -LiteralPath $checksum -Value "$hash  $($file.Name)" -Encoding ascii
          @(
            "### Installer",
            "",
            "- File: ``$($file.Name)``",
            "- Size: $($file.Length) bytes",
            "- SHA256: ``$hash``"
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/ClickBuildServer-Setup-*.exe
            dist/ClickBuildServer-Setup-*.exe.blockmap
            dist/ClickBuildServer-Setup-*.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
